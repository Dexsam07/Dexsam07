<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="6" viewBox="0 0 1000 6" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.25" stop-color="#7A0000"/>
      <stop offset="0.5" stop-color="#FF2D2D"/>
      <stop offset="0.75" stop-color="#7A0000"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1000" height="2" rx="1" fill="url(#g)"/>
  <rect x="-200" y="2" width="200" height="2" rx="1" fill="url(#s)">
    <animate attributeName="x" from="-200" to="1000" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
